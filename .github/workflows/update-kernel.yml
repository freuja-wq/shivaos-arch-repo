name: Auto-update linux-shivaos kernel

on:
  schedule:
    # Vérifie chaque nuit à 2h UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Libérer espace disque (kernel build = ~20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/swift /usr/local/julia* 2>/dev/null || true
          sudo apt-get clean -y
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Récupérer la dernière version stable Linux
        id: kernel
        run: |
          # kernel.org fournit un JSON avec les versions stables
          LATEST=$(curl -s https://www.kernel.org/releases.json \
            | python3 -c "
import sys, json
releases = json.load(sys.stdin)['releases']
# Prendre la dernière 'stable' ou 'mainline'
for r in releases:
    if r['moniker'] in ('stable', 'mainline'):
        print(r['version'])
        break
")
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Dernière version kernel : $LATEST"

      - name: Lire la version actuelle dans PKGBUILD
        id: current
        run: |
          CURRENT=$(grep '^pkgver=' PKGBUILDs/linux-shivaos/PKGBUILD | cut -d= -f2)
          BORE_VER=$(grep '^_borever=' PKGBUILDs/linux-shivaos/PKGBUILD | cut -d= -f2)
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "bore=$BORE_VER" >> $GITHUB_OUTPUT
          echo "Version actuelle PKGBUILD : $CURRENT (BORE $_borever)"

      - name: Comparer les versions
        id: compare
        run: |
          NEW="${{ steps.kernel.outputs.version }}"
          OLD="${{ steps.current.outputs.version }}"
          if [ "$NEW" != "$OLD" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            # Calculer le nouveau _borever (major.minor uniquement)
            NEW_BORE=$(echo "$NEW" | cut -d. -f1-2)
            echo "new_bore=$NEW_BORE" >> $GITHUB_OUTPUT
            echo "🆕 Mise à jour kernel : $OLD → $NEW (BORE $NEW_BORE)"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "✅ Kernel déjà à jour : $OLD"
          fi

      - name: Vérifier si le patch BORE existe pour la nouvelle version
        if: steps.compare.outputs.needs_update == 'true'
        id: bore
        run: |
          NEW_BORE="${{ steps.compare.outputs.new_bore }}"
          OLD_BORE="${{ steps.current.outputs.bore }}"

          # Vérifier si la branche BORE existe pour la nouvelle version kernel
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://raw.githubusercontent.com/firelzrd/bore-scheduler/main/patches/stable/linux-${NEW_BORE}-bore/0001-linux${NEW_BORE}-rc2-bore-6.6.3.patch" 2>/dev/null || \
          curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/firelzrd/bore-scheduler/contents/patches/stable/linux-${NEW_BORE}-bore")

          if [ "$HTTP" = "200" ]; then
            echo "patch_available=true" >> $GITHUB_OUTPUT
            echo "✅ Patch BORE disponible pour linux-${NEW_BORE}"
          elif [ "$NEW_BORE" = "$OLD_BORE" ]; then
            # Même major.minor → patch BORE existant fonctionne toujours
            echo "patch_available=true" >> $GITHUB_OUTPUT
            echo "✅ Même major.minor ($NEW_BORE) — patch BORE réutilisable"
          else
            echo "patch_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Patch BORE non encore disponible pour linux-${NEW_BORE} — attente"
          fi

      - name: Télécharger le patch BORE si nécessaire
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.bore.outputs.patch_available == 'true' &&
          steps.compare.outputs.new_bore != steps.current.outputs.bore
        run: |
          NEW_BORE="${{ steps.compare.outputs.new_bore }}"

          # Chercher le bon fichier patch dans le repo firelzrd
          PATCH_URL=$(curl -s "https://api.github.com/repos/firelzrd/bore-scheduler/contents/patches/stable/linux-${NEW_BORE}-bore" \
            | python3 -c "
import sys, json
files = json.load(sys.stdin)
for f in files:
    if f['name'].endswith('.patch'):
        print(f['download_url'])
        break
" 2>/dev/null || echo "")

          if [ -n "$PATCH_URL" ]; then
            curl -sL "$PATCH_URL" -o "PKGBUILDs/linux-shivaos/bore-${NEW_BORE}.patch"
            echo "✅ Nouveau patch BORE téléchargé : bore-${NEW_BORE}.patch"
          else
            echo "⚠️ Impossible de trouver le patch — utilisation du patch existant"
          fi

      - name: Mettre à jour le PKGBUILD
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.bore.outputs.patch_available == 'true'
        run: |
          NEW_VER="${{ steps.kernel.outputs.version }}"
          OLD_VER="${{ steps.current.outputs.version }}"
          NEW_BORE="${{ steps.compare.outputs.new_bore }}"

          sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILDs/linux-shivaos/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"          PKGBUILDs/linux-shivaos/PKGBUILD
          sed -i "s/^_kernver=.*/_kernver=${NEW_VER}/" PKGBUILDs/linux-shivaos/PKGBUILD
          sed -i "s/^_borever=.*/_borever=${NEW_BORE}/" PKGBUILDs/linux-shivaos/PKGBUILD
          sed -i "s/^_archconfig=.*/_archconfig=${NEW_VER}.arch1-1/" PKGBUILDs/linux-shivaos/PKGBUILD

          echo "PKGBUILD mis à jour : ${OLD_VER} → ${NEW_VER}"

      - name: Build du kernel (container Arch)
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.bore.outputs.patch_available == 'true'
        run: |
          mkdir -p repo/x86_64
          NEW_BORE="${{ steps.compare.outputs.new_bore }}"

          # Vérifier que le patch BORE est là
          ls PKGBUILDs/linux-shivaos/bore-*.patch || true

          docker run --rm \
            -v "$PWD/PKGBUILDs/linux-shivaos:/build" \
            -v "$PWD/repo/x86_64:/repo" \
            archlinux:latest \
            bash -c "
              set -e
              pacman -Sy --noconfirm base-devel bc cpio gettext libelf pahole perl python tar xz zstd 2>/dev/null | tail -5
              useradd -m builder
              chown -R builder:builder /build
              su builder -c 'cd /build && makepkg -s --noconfirm --noprogressbar --skipchecksums 2>&1'
              mv /build/*.pkg.tar.zst /repo/ 2>/dev/null || true
              echo 'Build terminé'
              ls /repo/
            "

      - name: Mettre à jour la base de données pacman
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.bore.outputs.patch_available == 'true'
        run: |
          docker run --rm \
            -v "$PWD/repo/x86_64:/repo" \
            -w /repo \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm 2>/dev/null
              repo-add shivaos.db.tar.gz *.pkg.tar.zst
              ln -sf shivaos.db.tar.gz shivaos.db
              ln -sf shivaos.files.tar.gz shivaos.files
            "

      - name: Commit et push
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.bore.outputs.patch_available == 'true'
        run: |
          git config user.name "ShivaOS Bot"
          git config user.email "contact@shivaos.com"
          git add PKGBUILDs/linux-shivaos/ repo/x86_64/
          git commit -m "auto: linux-shivaos ${{ steps.current.outputs.version }} → ${{ steps.kernel.outputs.version }}"
          git push

      - name: Résumé
        run: |
          if [ "${{ steps.compare.outputs.needs_update }}" != "true" ]; then
            echo "✅ Kernel déjà à jour : ${{ steps.current.outputs.version }}"
          elif [ "${{ steps.bore.outputs.patch_available }}" != "true" ]; then
            echo "⏳ Kernel ${{ steps.kernel.outputs.version }} dispo mais patch BORE pas encore publié — retry demain"
          else
            echo "✅ linux-shivaos mis à jour : ${{ steps.current.outputs.version }} → ${{ steps.kernel.outputs.version }}"
          fi
